services:
  - type: web
    name: electravelin-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      # Nota: el plan free usa disco efímero; para persistir usuarios, viajes y
      # favoritos usa Supabase (supabase/migrations) o un disco en plan pagado.

  - type: web
    name: electravelin-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://electravelin-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
